name: EoSim Sanity

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  # Install an existing immutable EoSim release tag directly from source.
  EOSIM_VERSION: "3.0.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-validate:
    name: Install & Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EoSim
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git "${{ runner.temp }}/eosim"
          pip install -e "${{ runner.temp }}/eosim"
      - name: Verify installation
        run: |
          eosim --version
          eosim list
      - name: Exercise registry and doctor commands
        run: |
          eosim list
          eosim doctor

  nested-simulation:
    name: EoSim run smoke check (${{ matrix.platform }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - esp32
          - nrf52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/eosim
          pip install -e /tmp/eosim
      - name: Exercise EoSim run command (${{ matrix.platform }})
        run: |
          eosim run ${{ matrix.platform }} --headless --timeout 10
          echo "${{ matrix.platform }}: eosim run exited successfully (execution may be a dry run)"

  nested-guest-install:
    name: Linux platform run smoke check (${{ matrix.guest }})
    needs: install-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - guest: Linux x86_64
            platform: x86_64-linux
          - guest: Linux aarch64
            platform: arm64-linux
          - guest: Linux riscv64
            platform: riscv64-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/eosim
          pip install -e /tmp/eosim
      - name: Exercise EoSim run command for ${{ matrix.guest }}
        run: |
          echo "=== Platform run smoke check: ${{ matrix.guest }} ==="
          eosim run ${{ matrix.platform }} --headless --timeout 15
          echo "${{ matrix.guest }}: eosim run exited successfully (execution may be a dry run)"

  windows-sanity:
    name: Windows Sanity
    needs: install-validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test EoSim on Windows
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git "${{ runner.temp }}/eosim"
          pip install -e "${{ runner.temp }}/eosim"
          eosim --version
          eosim list
          eosim doctor

  macos-sanity:
    name: macOS Sanity
    needs: install-validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test EoSim on macOS
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git "${{ runner.temp }}/eosim"
          pip install -e "${{ runner.temp }}/eosim"
          eosim --version
          eosim list
          eosim doctor

  sanity-gate:
    name: EoSim Sanity Gate
    if: always()
    needs: [install-validate, nested-simulation, nested-guest-install, windows-sanity, macos-sanity]
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "════════════════════════════════════════════════"
          echo "  EoSim Sanity Results"
          echo "════════════════════════════════════════════════"
          echo "Install & Validate (3 OS × 3 Py):  ${{ needs.install-validate.result }}"
          echo "Run-command smoke checks (7):        ${{ needs.nested-simulation.result }}"
          echo "Linux platform smoke checks (3):     ${{ needs.nested-guest-install.result }}"
          echo "Windows Sanity:                     ${{ needs.windows-sanity.result }}"
          echo "macOS Sanity:                       ${{ needs.macos-sanity.result }}"
          echo "════════════════════════════════════════════════"
          for result in \
            "${{ needs.install-validate.result }}" \
            "${{ needs.nested-simulation.result }}" \
            "${{ needs.nested-guest-install.result }}" \
            "${{ needs.windows-sanity.result }}" \
            "${{ needs.macos-sanity.result }}"; do
            if [ "$result" != "success" ]; then
              echo "❌ A required EoSim installation or CLI smoke job failed or was skipped"
              exit 1
            fi
          done
          echo "✅ All EoSim installation and CLI smoke checks passed"
