name: EoSim CLI Validation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Install an existing immutable EoSim release tag directly from source.
  EOSIM_VERSION: "3.0.1"

permissions:
  contents: read

jobs:
  simulate:
    name: EoSim run smoke check (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - arm64-linux
          - riscv64-linux
          - stm32f4
          - raspi4
          - esp32
          - nrf52
          - vexpress-a9
          - sifive_u
          - imx8m
          - jetson-nano
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim from source
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git /tmp/eosim
          pip install -e /tmp/eosim
      - name: Load platform registry
        run: eosim list
      - name: Exercise EoSim run command
        run: |
          echo "=== EoSim run-command smoke check: ${{ matrix.platform }} ==="
          eosim run ${{ matrix.platform }} --headless --timeout 15
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          eosim info ${{ matrix.platform }} > out/${{ matrix.platform }}-info.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eosim-validation-${{ matrix.platform }}
          path: out/
          retention-days: 7

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EoSim
        run: |
          git clone --depth 1 --branch v${{ env.EOSIM_VERSION }} https://github.com/embeddedos-org/EoSim.git "${{ runner.temp }}/eosim"
          pip install -e "${{ runner.temp }}/eosim"
      - name: Exercise EoSim registry and doctor commands
        run: |
          eosim list
          eosim doctor

  sanity-gate:
    name: EoSim CLI Validation Gate
    runs-on: ubuntu-latest
    needs: [simulate, cross-platform]
    if: always()
    steps:
      - name: Results
        run: |
          echo "════════════════════════════════════════════"
          echo "  EoSim CLI Validation Results — EIPC"
          echo "════════════════════════════════════════════"
          echo "Run-command smoke checks (11): ${{ needs.simulate.result }}"
          echo "Cross-Platform (Win/Lin/Mac):  ${{ needs.cross-platform.result }}"
          echo "════════════════════════════════════════════"
          if [ "${{ needs.simulate.result }}" != "success" ]; then
            echo "❌ EoSim run-command validation failed"; exit 1
          fi
          if [ "${{ needs.cross-platform.result }}" != "success" ]; then
            echo "❌ Cross-platform validation failed"; exit 1
          fi
          echo "✅ All EoSim CLI validation checks passed"
