name: CI

on:
  workflow_dispatch:
  repository_dispatch:
    types: [dependency-update]
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: go vet
        run: go vet ./...
      - name: Run tests
        run: go test -race -v -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run staticcheck
        run: staticcheck ./...

  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run fuzz tests
        run: |
          set -e
          for pkg in $(go list ./... | grep -E 'protocol|core|security'); do
            go test -fuzz=. -fuzztime=30s "$pkg" || true
          done

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: benchmark.txt

  build-c-sdk:
    name: C SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build C SDK (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd sdk/c
          if [ -f CMakeLists.txt ]; then
            cmake -B build
            cmake --build build --parallel
          elif [ -f Makefile ]; then
            make
          else
            echo "::warning::No build system found in sdk/c"
          fi
      - name: Build C SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd sdk/c
          if [ -f CMakeLists.txt ]; then
            cmake -B build -A x64
            cmake --build build --config Release --parallel
          else
            echo "::warning::No CMakeLists.txt found in sdk/c on Windows"
          fi
