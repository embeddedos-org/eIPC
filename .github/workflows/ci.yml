name: CI — eIPC

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

  c-sdk:
    name: C SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S sdk/c -B build/c
          -DCMAKE_BUILD_TYPE=Debug
          -DEIPC_BUILD_TESTS=ON
          -DEIPC_SKIP_INSTALL=ON
      - name: Build
        run: cmake --build build/c --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/c -C Debug --output-on-failure --no-tests=error

  static-analysis:
    name: C SDK static analysis
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Run cppcheck
        run: >-
          cppcheck
          --enable=warning,performance,portability
          --error-exitcode=1
          --suppress=missingIncludeSystem
          -Isdk/c/include
          sdk/c/src
