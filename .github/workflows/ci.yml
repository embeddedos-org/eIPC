name: CI — eIPC

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  # ── Build, vet, test ──────────────────────────────────────────────────
  # eIPC is a Go project (go.mod, cmd/, core/, transport/). This workflow
  # used to be a C++ template running `cmake -B build/host` against a
  # tree with no CMakeLists.txt, so it could never pass.
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        shell: bash
        run: |
          out=$(gofmt -l cmd core transport)
          if [ -n "$out" ]; then
            echo "::error::files need gofmt: $out"
            exit 1
          fi

      - name: Test
        # -race on macOS: Go 1.22 race-enabled test binaries abort on the
        # current macos-latest runner image ("dyld: missing LC_UUID load
        # command"). Race coverage stays on Linux; macOS runs plain tests.
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            go test -count=1 ./...
          else
            go test -race -count=1 ./...
          fi

  # ── Cross-compile all platforms ───────────────────────────────────────
  cross:
    name: Cross-compile binaries
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: make build-all

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: eipc-binaries
          path: bin/
          retention-days: 14

  # ── Release ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: [test, cross]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Package
        run: |
          cd bin
          for f in *; do
            tar czf "../eipc-${{ github.ref_name }}-$f.tar.gz" "$f"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: eipc-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
